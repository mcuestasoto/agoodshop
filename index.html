<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agoodshop · Carrito de compra</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>agoodshop</h1>
    </header>

    <p id="estado" role="status">Cargando productos...</p>

    <main>
        <section>
            <h2>Productos</h2>
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="productos"></tbody>
            </table>
        </section>

        <aside>
            <h2>Tu carrito</h2>
            <ul id="resumen"></ul>
            <p class="total">Total: <strong id="total">0,00 €</strong></p>
        </aside>
    </main>
</body>
</html>
